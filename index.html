<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Leagues</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --turf: #14412b;
            --turf-deep: #0c2b1c;
            --chalk: #eef1ec;
            --card: #ffffff;
            --ink: #15201a;
            --muted: #5b6b61;
            --line: #d6ddd3;
            --ball: #b32d22;
            --ball-deep: #8f2018;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hanken Grotesk', system-ui, sans-serif;
            background: var(--chalk);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        .team-dashboard {
            display: grid;
            height: 100vh;
            grid-template-rows: auto 1fr;
        }

        /* Top bar */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: var(--turf);
            padding: 14px 32px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            font-family: 'Big Shoulders Display', sans-serif;
            font-weight: 800;
            font-size: 1.7rem;
            line-height: 1;
            letter-spacing: 0.01em;
            color: #f3f6ef;
        }

        .buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .buttons button {
            padding: 9px 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.28);
            background: transparent;
            color: #d3e0d6;
            border-radius: 999px;
            font: 600 0.9rem 'Hanken Grotesk', sans-serif;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .buttons button:hover {
            border-color: #ffffff;
            color: #ffffff;
        }

        .buttons button.active {
            background: #f3f6ef;
            color: var(--turf-deep);
            border-color: #f3f6ef;
        }

        .buttons button:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 3px;
        }

        /* Content area */
        .container {
            padding: 32px max(24px, calc((100vw - 1240px) / 2)) 56px;
            overflow-y: auto;
        }

        .league-section {
            margin-bottom: 44px;
        }

        .league-title {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 22px;
            padding-left: 14px;
            border-left: 6px solid var(--ball);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .league-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .cards-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        /* Team card */
        .team-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }

        .team-card:hover {
            border-color: var(--turf);
        }

        /* Mown outfield stripes behind the squad photo */
        .img-container {
            position: relative;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: repeating-linear-gradient(90deg, #1a5236 0 36px, #154530 36px 72px);
        }

        .squad-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-img-wrapper {
            position: absolute;
            bottom: -34px;
            left: 50%;
            transform: translateX(-50%);
            width: 68px;
            height: 68px;
            padding: 6px;
            background: #ffffff;
            border: 3px solid var(--card);
            border-radius: 50%;
            box-shadow: 0 0 0 1px var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 1;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .card-content {
            padding: 50px 18px 18px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .team-category {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--turf);
            background: #e3ede5;
            padding: 3px 10px;
            border-radius: 4px;
            width: fit-content;
            margin: 0 auto;
        }

        .team-name {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .chase-btn {
            display: block;
            width: 100%;
            padding: 11px;
            margin-top: auto;
            background: var(--ball);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font: 700 0.9rem 'Hanken Grotesk', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .chase-btn:hover {
            background: var(--ball-deep);
        }

        .chase-btn:active {
            transform: scale(0.98);
        }

        .chase-btn:focus-visible {
            outline: 3px solid var(--turf);
            outline-offset: 2px;
        }

        @media (max-width: 768px) {
            .top-navbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 14px 20px;
            }

            .container {
                padding: 24px 20px 48px;
            }

            .league-title {
                font-size: 1.8rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

    <div class="team-dashboard">
        <div class="top-navbar">
            <div class="brand">Cricket Leagues</div>
            <div class="buttons" id="btns"></div>
            <!-- Search bar removed. This hidden field only keeps the existing JS from erroring on a missing #search. -->
            <input type="text" id="search" hidden>
        </div>
        <div class="container" id="showData"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
